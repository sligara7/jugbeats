<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the highway reaches the edges; the CSS puts the keys
     back inside the safe area, which in landscape is where the notch lives. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>JugBeats — make a phonk beat</title>

<!-- The chat preview (cap:link-preview-card). WhatsApp needs ABSOLUTE urls and
     caches them hard, so these have to be right BEFORE the link is shared. -->
<meta property="og:type" content="website">
<meta property="og:title" content="JugBeats">
<meta property="og:description" content="Turn your phone sideways, tap the blocks, make a phonk beat. Then send it back.">
<meta property="og:image" content="https://sligara7.github.io/jugbeats/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://sligara7.github.io/jugbeats/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0d0a14">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="stage"></canvas>

<!-- Top left: what she is playing right now, and at what speed. -->
<div class="status">
  <div id="round" class="round"></div>
  <div id="bpm" class="bpm"></div>
</div>

<!-- Top right: the rounds she has done, and sending it on. -->
<div class="strip">
  <div id="rounds" class="rounds" aria-label="your rounds"></div>
  <button id="share" class="share" aria-label="send your beat">send ▸</button>
</div>

<div id="nudge" class="nudge" role="status" aria-live="polite"></div>

<!-- The transport, straight down the middle — the one place on a landscape
     phone where neither thumb rests (dec:two-thumbs-loop-pedal). -->
<div class="transport">
  <button id="transport" class="go">TAP 0/4</button>
  <!-- Spelled out, and named for whatever it would actually clear right now —
       "new tempo", "clear hats". An icon made her guess. -->
  <button id="reset" class="reset" hidden>clear</button>
</div>

<!-- The first-tap gate. Audio cannot start outside a gesture on iOS, so this
     screen is not decoration — it is the only place sound can be started. -->
<div id="gate" class="gate">
  <div class="gate-inner">
    <h1 id="gate-title">JugBeats</h1>
    <p id="gate-label" class="gate-label">loading the sounds…</p>
    <p class="hint">no sound? check the little switch on the side of your phone</p>
  </div>
</div>

<div class="rotate">
  <div>
    <div class="rotate-icon">▭</div>
    <p>turn your phone sideways</p>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
