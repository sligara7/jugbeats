<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rain</title>

<!--
  THE RAIN PAGE — the third bed, and the first one built on the shared engine.
//
  WHAT MAKES RAIN RAIN, AND NOT JUST BRIGHTER SURF. A wave is one slow shape
  arriving over ten seconds. Rain is the opposite: a steady bed of countless
  impacts too small to hear individually, with DISCRETE DROPS picked out on top
  of it. Take the drops away and you have hiss; take the hiss away and you have a
  dripping tap. It needs both, and the drops are the part that says "rain".

  AND THE DROPS CANNOT BE SCHEDULED. Every bed here rests on no JavaScript
  running after the tap, because a backgrounded tab on a locked phone has its
  timers stopped — so a drop cannot be a timer, and eight hours of individually
  scheduled drops is hundreds of thousands of events.

  SO THE DROPS ARE BAKED INTO THE BUFFER AND THE BUFFER LOOPS. Twenty seconds of
  rain with two hundred-odd drops already in it, played on repeat, needs nothing
  to keep going. Two of them at coprime lengths never line up the same way, so
  the pattern does not repeat audibly — the same trick the waves use for their
  swell and the game uses for its round lengths.

  A DROP THAT STRADDLES THE END WRAPS AROUND TO THE START, which is what makes
  the loop seamless. There is no crossfade here and none is needed: the drops are
  written modulo the buffer length, so the last one simply finishes at the
  beginning, exactly as it would have done if the buffer were longer.

  KEPT DELIBERATELY DARKER THAN REAL RAIN. Rain has far more high-frequency
  energy than the car cabin the first bed imitated, and the high end is both the
  harsh part over hours and the part that carries the exposure risk
  (dec:idea-how-loud-and-for-how-long). The top is rolled off at 5.5 kHz and the
  ceiling sits below the other two, so this is rain heard through a window rather
  than rain on your face.
-->

<meta name="theme-color" content="#080a0c">
<meta property="og:type" content="website">
<meta property="og:title" content="Rain">
<meta property="og:description" content="Steady rain to fall asleep to. Pick how long, and put the phone across the room.">
<meta property="og:url" content="https://sligara7.github.io/jugbeats/rain/">

<link rel="stylesheet" href="../css/bed.css">
<style>:root { --accent: #9fb9cc; --bg: #080a0c; }</style>
</head>
<body>

<main>
  <div id="start">
    <h1>Rain</h1>
    <p class="sub">Steady rain, heard through a window.</p>

    <p class="place">Put the phone across the room — <strong>not</strong> in the crib or the cot.
      Then turn the volume up until you can just hear it from where the baby is.</p>

    <div class="label">play for</div>
    <div class="times">
      <button data-min="15">15 min</button>
      <button data-min="30">30 min</button>
      <button data-min="60">1 hour</button>
      <button data-min="120">2 hours</button>
      <button data-min="240">4 hours</button>
      <button data-min="480">8 hours</button>
    </div>
    <p class="err" id="err"></p>
  </div>

  <div id="playing">
    <div class="left">stops in</div>
    <div class="clock" id="clock">—</div>
    <p class="hint">You can lock the phone. It keeps going, and fades out on its own.</p>
    <button id="stop">stop now</button>
  </div>
</main>

<script type="module">
import { runBed, pinkLoop, envelopeLoop, modulate, noiseLayer } from '../js/bed.js';

/** Below the other two beds. Rain is brighter, and brighter reads louder. */
const CEILING = 0.18;

/**
 * WHERE THE TOP IS ROLLED OFF — and this is the lever that decides whether it is
 * a downpour or weather outside a window.
 *
 * The owner, 2026-09-21, having heard it: "kind of feels like you're in a
 * torrential downpour - maybe the frequency of the pink noise should shift
 * downwards to more brown noise so that it doesn't feel like you're in a
 * monsoon."
 *
 * He is describing the right thing. What makes rain sound CLOSE is its high end:
 * standing in it, you hear every impact; through a window, the glass and the
 * distance take the top off and leave the body. So the hiss band came down from
 * 320-3410 Hz to 150-1700, which is much the larger of the two changes, and the
 * drops lost their brightest octave with it — otherwise they become the only
 * sharp thing left and stick out of a bed that is no longer sharp.
 *
 * The drops' own ceiling moved again when the awning arrived: the canvas has a
 * lowpass of its own at AWNING_TOP and there is no point in two.
 */
const HISS_LOW = 150;
const HISS_TOP = 1700;

/**
 * HOW FAR THE NOISE IS TILTED FROM PINK TOWARDS BROWN — his other instruction,
 * and a separate control on purpose.
 *
 * Measured across the blend: the share of energy above 1.5 kHz falls from 49%
 * at pink to 26% at brown, while the rms does not move at all. So this changes
 * the COLOUR and nothing else, and the level below can be set without fighting
 * it.
 */
const BROWN = 0.8;

/**
 * HOW LOUD THE NOISE IS AGAINST THE DROPS — the owner's ear, 2026-09-21, on the
 * first version anybody actually heard: "the pink noise intensity should be
 * turned down by about a third".
 *
 * It scales BOTH noise layers and leaves the drops alone, which is the point of
 * the note: the wash was covering the rain rather than carrying it. Every
 * measured level below is stated before this multiplier.
 *
 * TURNED DOWN A SECOND TIME on 2026-09-21 — "maybe turn down the intensity of
 * the rain again" — from two thirds to 0.45.
 *
 * ⚠️ RAW RMS IS THE WRONG MEASURE HERE AND SAYS SO: overall it moves only -16%,
 * because narrowing the hiss band to 150-1700 Hz lets more LOW energy through
 * and that partly fills the gap. But low energy is body, not loudness — the ear
 * judges broadband noise mostly between 500 Hz and 4 kHz, and in that band this
 * is -34%. Another third off, as asked, measured where it is heard rather than
 * where it is easiest to total up.
 *
 * Density is deliberately NOT touched. It is the obvious next dial if this is
 * still too much, and moving it in the same breath would make it impossible to
 * tell which of the two helped.
 */
const NOISE = 0.45;

/**
 * AND HOW LOUD THE DROPS ARE — "turn the rain drops down too", 2026-09-21.
 *
 * A third off, to match what the noise was given. The reason it was needed is
 * worth keeping: NOTHING HAD TOUCHED THE DROPS, and they had still got louder.
 * Twice turning the wash down moved them from 0.48 of the hiss, where they were
 * first balanced, to 0.79 — loud enough to start reading as ticking rather than
 * as rain.
 *
 * AND IT HAPPENED AGAIN when the awning arrived: the surface lifted them to 0.96
 * of the hiss without a number of theirs changing. 0.383 is what puts the ratio
 * back to 0.57, which is where his ear left it.
 *
 * THAT IS WHY THIS IS ITS OWN DIAL RATHER THAN A NUMBER FOLDED INTO THE LEVELS
 * ABOVE. Every measured figure in this file is stated before its multiplier, so
 * moving one of the three — noise, drops, density — never silently moves another.
 */
const DROPS = 0.383;

/**
 * ONE DROP, WRITTEN STRAIGHT INTO A BUFFER.
 *
 * A short noise burst through a two-pole resonator, which is about the cheapest
 * thing that sounds struck rather than clicked. The resonance is what gives a
 * drop its pitch — a small drop on glass pings high, a big one on a sill thuds —
 * and randomising it across drops is most of why a loop of them reads as rain
 * rather than as a machine ticking.
 *
 * `at` may run past the end: the caller writes modulo the length, so a drop that
 * starts near the end finishes at the beginning and the loop has no seam.
 */
function addDrop(out, at, { hz, decay, level, rate }) {
  const w = (2 * Math.PI * hz) / rate;
  const r = Math.exp(-1 / (decay * rate));
  const c = 2 * r * Math.cos(w);
  const r2 = r * r;
  const burst = Math.max(2, Math.floor(rate * 0.0015));   // the impact itself
  const tail = Math.floor(decay * rate * 5);              // what rings after it

  // NORMALISED BY (1 - r), AND IT IS NOT OPTIONAL. A two-pole resonator has a
  // gain at resonance of roughly 1/(1 - r), which at these decay times is about
  // 290x. Measured before this line existed: peaks of 16 and 43 against a full
  // scale of 1, which is not a rain sound, it is destruction. Normalising here
  // also makes `level` mean the same thing whatever `decay` is, so a long drop
  // and a short one are equally loud rather than wildly not.
  const norm = (1 - r) * level;

  let y1 = 0, y2 = 0;
  for (let i = 0; i < burst + tail; i++) {
    const x = i < burst ? (Math.random() * 2 - 1) : 0;
    const y = x + c * y1 - r2 * y2;
    y2 = y1; y1 = y;
    out[(at + i) % out.length] += y * norm;
  }
}

/**
 * A loop of rain, with the drops already in it.
 *
 * Density is the thing to get right: too few and it is a dripping tap, too many
 * and the drops merge into the hiss they are supposed to sit on top of. These
 * are only the ones an ear picks out individually — the mass of rain is the
 * noise layer underneath.
 *
 * `level` IS SET AGAINST THE HISS RATHER THAN CHOSEN, and these numbers are all
 * stated BEFORE the NOISE and DROPS multipliers. Raw, the two drop loops sit at
 * about 0.48 of the hiss. As the bed stands — noise at 0.45, band narrowed,
 * drops at 0.65 — the hiss reaches the mix at about 0.023 rms and the drops at
 * about 0.012, which is 0.51 of it. Peaks stay near 0.46 and 0.31 before their
 * multiplier, so nothing clips before the ceiling.
 */
function dropLoop(ctx, { seconds, perSecond, hzLow, hzHigh, decay, level }) {
  const rate = ctx.sampleRate;
  const n = Math.floor(seconds * rate);
  const buf = ctx.createBuffer(1, n, rate);
  const out = buf.getChannelData(0);

  const count = Math.round(seconds * perSecond);
  for (let i = 0; i < count; i++) {
    addDrop(out, Math.floor(Math.random() * n), {
      // Log-spaced, so the ear hears the range as even rather than crowded high.
      hz: hzLow * Math.pow(hzHigh / hzLow, Math.random()),
      decay: decay * (0.6 + Math.random() * 0.8),
      // Mostly quiet with an occasional near one, which is what stops a loop of
      // drops sounding like a drum machine.
      level: level * Math.pow(Math.random(), 1.8),
      rate,
    });
  }
  return buf;
}

/**
 * THE AWNING — the surface the rain is falling ON.
 *
 * The owner's idea, 2026-09-21: "try filtering it so it sounds like it is
 * hitting a canvas tent, a tin roof, or heavy leaves. This muffles the sharp
 * 'splat' of the water droplets, turning the rain into a deeper, incredibly
 * cozy rumble."
 *
 * TWO THINGS HAVE TO HAPPEN AT ONCE, and doing only one of them does not work.
 *
 *   THE SPLAT HAS TO GO. Water hitting stone is a sharp broadband transient;
 *   water hitting stretched canvas is a damped thud, because the cloth absorbs
 *   the top and gives it back lower. That is the lowpass.
 *
 *   AND THE SURFACE HAS TO SPEAK. A tent is not a filter, it is a drum — a
 *   membrane a couple of metres across with its own low modes, excited by every
 *   drop that lands on it. Three gentle peaks stand in for those modes. They are
 *   what turns "quiet rain" into "rain on something", and they are the whole
 *   reason a lowpass alone sounds muffled rather than cosy.
 *
 * MODEST BOOSTS ON PURPOSE. Push these and it stops being canvas and becomes a
 * tin roof ringing, which is a different and much less restful thing. The trim
 * afterwards puts the level back where it was, so adding the surface does not
 * quietly undo the balance that was set by ear.
 */
const AWNING = [
  { hz: 105, q: 1.6, gain: 7.0 },
  { hz: 197, q: 2.2, gain: 5.0 },
  { hz: 340, q: 2.8, gain: 3.5 },
];

/** Where the canvas stops passing anything. Low, because this is the muffling. */
const AWNING_TOP = 1500;

/**
 * MEASURED, NOT GUESSED, so the resonances do not arrive as a volume increase.
 *
 * The surface adds a great deal: three boosts plus a lowpass that concentrates
 * what is left into the band the boosts sit in. A first guess of 0.42 was wrong
 * twice over, and the second way is the instructive one.
 *
 * ONE TRIM CANNOT SERVE TWO LAYERS, because the awning does different things to
 * each. It is set here to hold the HISS exactly where three rounds of listening
 * put it — that is the bed, and the level the owner actually approved. The drops
 * are then pulled back separately by DROPS, because through the awning they
 * arrived at 0.96 of the hiss against the 0.57 he had settled on.
 *
 * Adding a character must not quietly re-tune the levels underneath it. That is
 * the whole reason these numbers were solved together rather than one at a time.
 */
const AWNING_TRIM = 0.669;

/**
 * Build the surface: everything that lands on it goes in, the coloured result
 * comes out. Plain filter nodes, so it runs on the audio thread and needs
 * nothing after the tap like the rest of the bed.
 */
function awning(ctx, dest, t0) {
  const input = ctx.createGain();
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.Q.value = 0.7;
  lp.frequency.setValueAtTime(AWNING_TOP, t0);

  let node = lp;
  for (const m of AWNING) {
    const peak = ctx.createBiquadFilter();
    peak.type = 'peaking';
    peak.frequency.setValueAtTime(m.hz, t0);
    peak.Q.value = m.q;
    peak.gain.setValueAtTime(m.gain, t0);
    node.connect(peak);
    node = peak;
  }

  const trim = ctx.createGain();
  trim.gain.value = AWNING_TRIM;
  input.connect(lp);
  node.connect(trim).connect(dest);
  return input;
}

/**
 * THE SHOWER — the rain thickening and easing over minutes. Three coprime
 * periods, so it never does it twice the same way.
 */
const SHOWER = [[37, 0.13], [53, 0.10], [71, 0.08]];

/**
 * THE GUSTS — the owner's ear again, 2026-09-21: "maybe put a small rhythm to
 * the intensity of the background noise to simulate small fluctuations in the
 * rain/wind intensity."
 *
 * The same mechanism as the shower, an order of magnitude faster and much
 * shallower. The shower is weather over minutes; this is the wind leaning on it
 * every few seconds, which is the movement an ear notices as ALIVE rather than
 * as a recording.
 *
 * COPRIME AND SHALLOW, both load-bearing. Coprime because three periods that
 * share a multiple would beat together into an audible pulse, and a pulse is a
 * small event repeating — the exact thing a bed exists not to have. Shallow
 * because a gust that swings as hard as the shower does stops being weather and
 * becomes someone turning a knob.
 */
const GUSTS = [[5.3, 0.045], [8.9, 0.035], [13.7, 0.025]];

/**
 * WHAT THE HISS SITS AT BEFORE ANYTHING MODULATES IT.
 *
 * ⚠️ EVERY MODULATOR ADDS, so adding the gusts would have raised the AVERAGE
 * level by half their total depth — about 9% — and quietly handed back a slice
 * of what four rounds of listening had taken off. This is the third time in two
 * days that a change has moved a level nobody touched, so it is compensated at
 * the source rather than noticed afterwards: the base drops by exactly the mean
 * the gusts contribute, and the bed sits where his ear left it.
 */
const HISS_BASE = 0.42 - 0.5 * GUSTS.reduce((n, [, amount]) => n + amount, 0);

/** A shower easing in and out. Far slower and far gentler than a wave — rain
 *  does not surge, it thickens. */
const showerShape = (t) => 0.5 - 0.5 * Math.cos(2 * Math.PI * t);

runBed({
  title: 'Rain',
  ceiling: CEILING,
  fadeIn: 10,
  fadeOut: 90,

  build(ctx, dest, t0, sources) {
    // THE SURFACE EVERYTHING LANDS ON. Both the hiss and the drops go through
    // it, because both of them ARE rain hitting the canvas — the hiss is the
    // thousands of impacts too small to pick out, and colouring only the loud
    // ones would put them on a different roof from the quiet ones.
    const surface = awning(ctx, dest, t0);

    // ── the rumble ────────────────────────────────────────────────────────
    // Rain a long way off, under everything. This one goes DIRECT rather than
    // through the awning: it is the rain you hear beyond the canvas, and putting
    // it through the same resonances would leave the bed with no depth behind
    // the surface at all.
    noiseLayer(ctx, sources, { seconds: 11.7, cut: 200, gain: 0.55 * NOISE, brown: BROWN }, dest, t0);

    // ── the hiss ──────────────────────────────────────────────────────────
    // The mass of rain: every impact too small to pick out. Bandpassed rather
    // than lowpassed, because rain has very little down low — that is what the
    // rumble is for — and taking the bottom out keeps the two from muddying.
    const hissGain = ctx.createGain();
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(HISS_LOW, t0);
    hp.Q.value = 0.6;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.Q.value = 0.7;
    lp.frequency.setValueAtTime(HISS_TOP, t0);

    const hiss = ctx.createBufferSource();
    hiss.buffer = pinkLoop(ctx, 13.9, { brown: BROWN });
    hiss.loop = true;
    hiss.connect(hp).connect(lp).connect(hissGain).connect(surface);
    hiss.start(t0);
    sources.push(hiss);

    hissGain.gain.setValueAtTime(HISS_BASE * NOISE, t0);

    // The shower: weather over minutes.
    for (const [seconds, amount] of SHOWER) {
      const shape = envelopeLoop(ctx, seconds, showerShape);
      // The swell scales WITH the level, so the rain still thickens and eases by
      // the same proportion of itself rather than heaving by a fixed amount.
      modulate(ctx, sources, shape, amount * NOISE, t0, hissGain.gain);
      // The BRIGHTNESS does not scale. That is a cutoff, not a level, and
      // quieter rain is not duller rain — it is the same weather further off.
      modulate(ctx, sources, shape, amount * 1100, t0, lp.frequency);
    }

    // The gusts: the wind leaning on it every few seconds.
    for (const [seconds, amount] of GUSTS) {
      const shape = envelopeLoop(ctx, seconds, showerShape);
      modulate(ctx, sources, shape, amount * NOISE, t0, hissGain.gain);
      // DELIBERATELY NO BRIGHTNESS ON THESE. A gust does open the top a little in
      // life, but the last three corrections were all about taking the top OFF,
      // and a fast flicker in the treble is the first thing an ear picks out of a
      // quiet room. Level only.
    }

    // ── the drops ─────────────────────────────────────────────────────────
    // Two loops at coprime lengths: the near, small, bright ones and the rarer
    // big ones further off. Their patterns drift apart and never realign.
    const near = ctx.createBufferSource();
    near.buffer = dropLoop(ctx, {
      // LOWER AND LONGER THAN A DROP ON STONE. On canvas the impact does not
      // click, it thumps, and the cloth holds the note for a moment afterwards.
      seconds: 19.7, perSecond: 13, hzLow: 260, hzHigh: 1300, decay: 0.020, level: 2.2,
    });
    near.loop = true;

    const far = ctx.createBufferSource();
    far.buffer = dropLoop(ctx, {
      seconds: 23.3, perSecond: 3.5, hzLow: 110, hzHigh: 430, decay: 0.045, level: 1.6,
    });
    far.loop = true;

    const dropGain = ctx.createGain();
    dropGain.gain.value = 0.9 * DROPS;
    near.connect(dropGain);
    far.connect(dropGain);
    dropGain.connect(surface);
    near.start(t0);
    far.start(t0);
    sources.push(near, far);
  },
});
</script>
</body>
</html>
