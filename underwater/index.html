<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Underwater</title>

<!--
  THE UNDERWATER PAGE — the darkest bed in the family, but not the stillest.

  From the owner's list: "the muffled, bubbling sound of being underwater
  provides a highly insulated, womb-like audio environment. It completely cuts
  out harsh higher frequencies."

  WHY THIS ONE, AND WHY IT MAY BE THE BEST-AIMED OF ALL OF THEM. "Cuts out harsh
  higher frequencies" is a description of a lowpass, and every correction the
  owner has made by ear over two days has pulled this family downward: rain went
  from a 3410 Hz top to 1700, from pink toward brown, twice quieter.

  AND THE WOMB FRAMING IS NOT DECORATION. dec:idea-is-it-the-sound-or-the-car
  recorded, while working out why babies sleep in cars, that the womb is a LOUD,
  CONTINUOUS, LOW-PASSED place — blood flow and a muffled heartbeat — and that
  this is the reasoning behind shushing an infant. A deliberately muffled bed is
  the closest thing on the whole list to what the infant evidence actually points
  at. Closer than rain. Closer than a brook.

  ── WHAT IS DELIBERATELY NOT HERE ──────────────────────────────────────────

  THE WHALE. The owner's note mentioned "a deep whale song" in the same breath,
  and it is a different and much harder idea: muffled water is TEXTURE, and a
  whale song is a MELODY — it has intent, shape and direction, and it is
  recognisable the way a cat is. Everything in this family so far is noise-shaped
  and therefore forgiving, because nobody knows exactly what distant surf should
  sound like. Everybody knows roughly what a whale sounds like, and a synthesised
  one that is slightly wrong is uncanny rather than merely imperfect. It wants
  its own decision, and probably a recording.

  ── THE FIRST VERSION SOUNDED LIKE AN AEROPLANE ────────────────────────────

  The owner, on hearing it: "the underwater one sounds a lot like being on a
  passenger jet." He was right, and the cause was a decision made here on
  purpose.

  STEADY BROADBAND NOISE, LOWPASSED LOW, IS THE ACOUSTIC DEFINITION OF A JET
  CABIN — that is exactly what engine and airflow noise is. The first version had
  a lowpass pinned at a flat 620 Hz, because a comment in the code argued that
  "the top is the thing being withheld, and letting it breathe would undo the
  only idea this bed has". That reasoning was wrong.

  THE IDEA IS DARK, NOT STILL. A spectrum that never moves is a machine. Water is
  dark AND constantly moving, and the movement is what tells you which one you
  are inside. The top now sweeps between about 620 and 2000 Hz across two
  timescales — a slow swell and a FLOW every few seconds that a jet has nothing
  like — and a five-second window carries 2.7x the movement it did.

  AND THE BUBBLES WERE HIDDEN, which was the other half. At 0.9 and 0.35 a second
  under an 870 Hz lowpass they were nearly inaudible, leaving no cue at all that
  this was water. A bubble is the one sound nothing else makes, so it is the
  identifying feature and it was being suppressed. Three times as many now, and
  allowed up to 2200 Hz where an ear can actually find them.

  ── WHAT THE DEEP-SEA RESEARCH CONFIRMED, AND WHAT IT ADDED ────────────────

  The owner sent an account of deep ocean acoustics after this bed was lowered.
  It recommends "a heavy brown noise base" and "an aggressive low-pass filter set
  around 150 Hz to 300 Hz" — and the change had already gone out at full brown
  with the top at 260. Two routes to the same numbers, which is the only kind of
  agreement worth much.

  WHAT IT ADDED WAS THE GHOST. "What remains of surface weather is just a faint,
  continuous, ghost-like hum at the higher end of the deep-sea spectrum." That is
  a DEPTH CUE and this bed did not have one: dark alone is muffled, but dark with
  something faint and far above it is DEEP, because the ear reads the gap between
  them as distance. See SURFACE.

  ⚠️ AND ONE THING IN IT CANNOT BE BUILT, WHICH IS WORTH SAYING RATHER THAN
  QUIETLY IGNORING. The research puts the real energy between 1 and 100 Hz —
  tectonic rumble, and whales at 10 to 40 Hz "often felt as pressure vibrations
  rather than heard". A phone speaker produces essentially none of that. FLOOR
  sits at 40 Hz as a gesture at it, but the honest position is that the most
  characteristic part of the deep ocean is exactly the part this delivery cannot
  reproduce. That is a limit of the speaker, not of the idea.

  ── THE RISK THAT STILL STANDS ─────────────────────────────────────────────

  A bed this dark may be inaudible on a phone speaker across a room, which is
  exactly where it is meant to be used. A phone reproduces very little below
  about 300 Hz — dec:drone-voiced-up exists in the game for that reason and voiced
  its drone UP two octaves to survive. So the bottom here is deliberately not as
  low as "underwater" would suggest: muffled, not subsonic.
-->

<meta name="theme-color" content="#04080c">
<meta property="og:type" content="website">
<meta property="og:title" content="Underwater">
<meta property="og:description" content="Muffled, insulated, and very dark. Pick how long, and put the phone across the room.">
<meta property="og:url" content="https://sligara7.github.io/jugbeats/underwater/">

<link rel="stylesheet" href="../css/bed.css">
<style>:root { --accent: #6fb6d6; --bg: #04080c; }</style>
</head>
<body>

<main>
  <div id="start">
    <h1>Underwater</h1>
    <p class="sub">Muffled and far from anything.</p>

    <p class="place">Put the phone across the room — <strong>not</strong> in the crib or the cot.
      Then turn the volume up until you can just hear it from where the baby is.</p>

    <div class="label">play for</div>
    <div class="times">
      <button data-min="15">15 min</button>
      <button data-min="30">30 min</button>
      <button data-min="60">1 hour</button>
      <button data-min="120">2 hours</button>
      <button data-min="240">4 hours</button>
      <button data-min="480">8 hours</button>
    </div>
    <p class="err" id="err"></p>
  </div>

  <div id="playing">
    <div class="left">stops in</div>
    <div class="clock" id="clock">—</div>
    <p class="hint">You can lock the phone. It keeps going, and fades out on its own.</p>
    <button id="stop">stop now</button>
  </div>
</main>

<script type="module">
import { runBed, pinkLoop, envelopeLoop, modulate, noiseLayer, transientLoop } from '../js/bed.js';

/**
 * HALF AS MUCH AGAIN AS THE OTHER BEDS, WHICH LOOKS WRONG AND IS NOT.
 *
 * Loudness is judged mostly between 500 Hz and 4 kHz, and almost nothing here
 * reaches that band — so at rain's ceiling this bed would be barely present.
 * Same measured loudness, larger number.
 *
 * It rose from 0.26 when the bed was lowered, and the amount was measured rather
 * than guessed: dropping the band to 40-260 Hz takes energy out of exactly the
 * range the ear weighs, so 0.33 is what holds the loudness where it already was.
 * A first attempt at 0.40 would have made it LOUDER while meaning to leave it
 * alone — the same trap four levels in /rain/ fell into.
 */
const CEILING = 0.33;

/** Where everything stops. This is the muffling, and it is the whole idea. */
const TOP = 260;

/**
 * ⚠️ MUCH LOWER THAN THE FIRST TWO VERSIONS, AND AGAINST MY OWN ARGUMENT.
 *
 * This constant used to be 170 and carried a note saying it must not go lower,
 * because a phone reproduces very little below about 300 Hz and a bed living
 * down there would be inaudible across a room.
 *
 * THE OWNER LISTENED AND SAID IT WAS NOT LOW ENOUGH: "the ocean frequency should
 * be lower - it isn't too far from how the regular sleep sounds." Measured, he is
 * exactly right and the margin was not close. Spectral centroid of /sleep/ is
 * 399 Hz; the version he heard was 452 — thirteen per cent ABOVE the bed it was
 * supposed to be nothing like. Two beds in the same band are one bed.
 *
 * The first correction tried was 90/700/200, which measured 404 Hz — still the
 * same sound as sleep. It took 40/260/120 at full brown to reach 344, fourteen
 * per cent BELOW sleep, and that is what is here.
 *
 * THE SPEAKER RISK IS REAL AND IS NOW ACCEPTED RATHER THAN AVOIDED. If this
 * vanishes on a phone across a room, that is the answer and the fix is to voice
 * it back up — but a bed that is safely audible and indistinguishable from
 * another bed is not worth having either.
 */
const FLOOR = 40;

/** Almost all the way to brown. Water is the one place where that is not a
 *  compromise but a description. */
const BROWN = 1.0;

/** The swell. Slower than surf and far slower than a gust: this is pressure and
 *  distance changing, not weather. */
const SWELLS = [[41, 0.16], [59, 0.12], [83, 0.09]];

/**
 * THE FLOW — water moving past, every few seconds.
 *
 * ⚠️ THIS EXISTS BECAUSE THE FIRST VERSION SOUNDED LIKE AN AEROPLANE. The owner,
 * on hearing it: "the underwater one sounds a lot like being on a passenger jet."
 *
 * He is right, and the diagnosis is not subtle once said out loud: STEADY
 * BROADBAND NOISE, LOWPASSED LOW, IS THE ACOUSTIC DEFINITION OF A JET CABIN.
 * That is exactly what engine and airflow noise is. What separates water from a
 * machine is not its darkness — it is that water MOVES and a machine does not.
 * The first version had a swell so slow and so gentle it read as constant, and
 * constant plus dark is an aeroplane.
 *
 * So this is a second, faster timescale on top of the swell. A jet has nothing
 * at this rate; moving water has little else.
 */
const FLOW = [[11.3, 0.10], [13.9, 0.075], [16.7, 0.055]];

/**
 * THE GHOST OF THE SURFACE — the one element the deep-sea research named that
 * this bed did not have.
 *
 * "The crisp, sharp sounds we associate with the ocean surface are completely
 * filtered out by the time you go deep. What remains of surface weather is just
 * a faint, continuous, ghost-like hum at the higher end of the deep-sea
 * spectrum."
 *
 * THAT IS A DEPTH CUE, AND IT IS THE REASON TO BOTHER. A bed that is only dark
 * is muffled; a bed that is dark WITH something faint and far above it is deep.
 * The ear reads the gap between the two as distance, and without the faint thing
 * there is no gap to read.
 *
 * Kept at a level where it is not separately identifiable — if you can tell what
 * it is, it is too loud and it stops being a ghost.
 */
const SURFACE = { cut: 1900, floor: 700, gain: 0.30 };

const BODY_BASE = 0.62
  - 0.5 * SWELLS.reduce((n, [, amount]) => n + amount, 0)
  - 0.5 * FLOW.reduce((n, [, amount]) => n + amount, 0);

/** A long, even rise and fall. Nothing underwater arrives. */
const swellShape = (t) => 0.5 - 0.5 * Math.cos(2 * Math.PI * t);

runBed({
  title: 'Underwater',
  ceiling: CEILING,
  fadeIn: 12,
  fadeOut: 90,

  build(ctx, dest, t0, sources) {
    // ── the pressure ──────────────────────────────────────────────────────
    // The lowest thing here, constant, and what gives the bed its weight. Kept
    // above FLOOR so a phone can actually produce it.
    noiseLayer(ctx, sources, { seconds: 11.7, cut: 120, gain: 0.5, brown: BROWN }, dest, t0);

    // ── the body ──────────────────────────────────────────────────────────
    // Water moving. A narrow band, because the whole character of being under
    // something is that almost nothing gets through.
    const bodyGain = ctx.createGain();
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(FLOOR, t0);
    hp.Q.value = 0.6;
    // ⚠️ TWO LOWPASS STAGES, NOT ONE, AND THE SECOND ONE IS LOAD-BEARING.
    //
    // "Apply an AGGRESSIVE low-pass filter" is what the deep-sea account asked
    // for, and one biquad is 12 dB an octave, which is not aggressive. Measured
    // with a single stage: the bed still put ten times more energy into the
    // 700-1900 Hz band than the surface ghost did, purely as leakage — so the
    // ghost was inaudible and the one thing giving this bed any sense of DEPTH
    // was being drowned by a filter skirt.
    //
    // Cascaded, it is 24 dB an octave, the leakage drops away, and the faint
    // thing far above can actually be the faint thing far above.
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.Q.value = 0.8;
    lp.frequency.setValueAtTime(TOP, t0);

    const lp2 = ctx.createBiquadFilter();
    lp2.type = 'lowpass';
    lp2.Q.value = 0.6;
    lp2.frequency.setValueAtTime(TOP, t0);

    const body = ctx.createBufferSource();
    body.buffer = pinkLoop(ctx, 13.9, { brown: BROWN });
    body.loop = true;
    body.connect(hp).connect(lp).connect(lp2).connect(bodyGain).connect(dest);
    body.start(t0);
    sources.push(body);

    bodyGain.gain.setValueAtTime(BODY_BASE, t0);

    // ⚠️ THE TOP MOVES NOW, AND REFUSING TO LET IT WAS THE BUG.
    //
    // The first version said, in a comment right here: "NO BRIGHTNESS ON THE
    // SWELL... the top is the thing being withheld, and letting it breathe would
    // undo the only idea this bed has." That reasoning was wrong, and it is the
    // reason it came out sounding like a passenger jet.
    //
    // The idea is DARK, not STILL. A spectrum that never moves is a machine —
    // that is precisely what makes cabin noise cabin noise. Water is dark AND
    // constantly moving, and the movement is what says which one you are in.
    for (const [seconds, amount] of SWELLS) {
      const shape = envelopeLoop(ctx, seconds, swellShape);
      modulate(ctx, sources, shape, amount, t0, bodyGain.gain);
      modulate(ctx, sources, shape, amount * 900, t0, lp.frequency, lp2.frequency);
    }

    // The faster movement, which is the half a jet cannot have.
    for (const [seconds, amount] of FLOW) {
      const shape = envelopeLoop(ctx, seconds, swellShape);
      modulate(ctx, sources, shape, amount, t0, bodyGain.gain);
      modulate(ctx, sources, shape, amount * 1100, t0, lp.frequency, lp2.frequency);
    }

    // ── the ghost of the surface ──────────────────────────────────────────
    // Weather happening a long way up, arriving as almost nothing. Slowly
    // breathing on its own cycle so it never sits still enough to be located.
    {
      const ghostGain = ctx.createGain();
      ghostGain.gain.setValueAtTime(SURFACE.gain * 0.72, t0);
      const ghp = ctx.createBiquadFilter();
      ghp.type = 'highpass';
      ghp.frequency.setValueAtTime(SURFACE.floor, t0);
      ghp.Q.value = 0.6;
      const glp = ctx.createBiquadFilter();
      glp.type = 'lowpass';
      glp.frequency.setValueAtTime(SURFACE.cut, t0);
      glp.Q.value = 0.7;

      const ghost = ctx.createBufferSource();
      ghost.buffer = pinkLoop(ctx, 17.3, { brown: 0.5 });
      ghost.loop = true;
      ghost.connect(ghp).connect(glp).connect(ghostGain).connect(dest);
      ghost.start(t0);
      sources.push(ghost);

      // Its own periods, coprime with everything else, so the surface and the
      // depths are never observed to move together.
      for (const [seconds, amount] of [[29.3, 0.35], [47.9, 0.25]]) {
        const shape = envelopeLoop(ctx, seconds, swellShape);
        modulate(ctx, sources, shape, SURFACE.gain * amount, t0, ghostGain.gain);
      }
    }

    // ── the bubbles ───────────────────────────────────────────────────────
    // Two loops at coprime prime lengths so nothing ever repeats. Still far
    // sparser than rain's thirteen a second — this is the sea rather than a fish
    // tank — but no longer so sparse that minutes pass without one.
    //
    // DECAY STAYS SHORT despite the low pitch, which is the lesson rain paid for:
    // a resonator held past about 100ms stops being a strike and becomes a PITCH,
    // and a pitched bubble is a marimba.
    // ⚠️ AND THEY WERE FAR TOO SPARSE AND TOO DARK TO DO THEIR JOB. At 0.9 and
    // 0.35 a second under an 870 Hz lowpass, they were nearly inaudible — which
    // left the bed with no cue at all that it was water rather than a machine.
    // A BUBBLE IS THE ONE SOUND NOTHING ELSE MAKES, so it is the identifying
    // feature and it was being hidden. Three times as many, and allowed up to
    // 2200 Hz where they can actually be picked out.
    const bubbleTop = ctx.createBiquadFilter();
    bubbleTop.type = 'lowpass';
    bubbleTop.frequency.setValueAtTime(1100, t0);
    bubbleTop.Q.value = 0.7;
    const bubbleGain = ctx.createGain();
    bubbleGain.gain.value = 0.85;
    bubbleTop.connect(bubbleGain).connect(dest);

    for (const cfg of [
      { seconds: 127, perSecond: 2.6, hzLow: 130, hzHigh: 600, decay: 0.012, level: 1.5 },
      { seconds: 167, perSecond: 1.1, hzLow: 200, hzHigh: 900, decay: 0.008, level: 1.1 },
    ]) {
      const src = ctx.createBufferSource();
      src.buffer = transientLoop(ctx, cfg);
      src.loop = true;
      src.connect(bubbleTop);
      src.start(t0);
      sources.push(src);
    }
  },
});
</script>
</body>
</html>
