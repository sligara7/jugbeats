<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Underwater</title>

<!--
  THE UNDERWATER PAGE — and the one that has been wrong the most times.

  ── FOUR VERSIONS, THREE OF THEM CORRECTED BY THE OWNER ────────────────────

    1. dark, still, heavily lowpassed   -> "sounds a lot like being on a
                                            passenger jet"
    2. given movement and brighter      -> "the ocean frequency should be lower
                                            - it isn't too far from how the
                                            regular sleep sounds"
    3. driven an octave and a half down -> measured against a real recording and
                                            found to be nowhere near it
    4. this one, fitted to that recording

  ── WHAT THE RECORDINGS SAY, AND WHY IT REVERSES INSTRUCTION 2 ─────────────

  Median of three clips:

      centroid 653 Hz   peak 686   Q 1.4   sd/mean 0.75   onsets 3.6/s
      1.9% under 250 Hz | 18.8% in 250-500 | 74.6% in 500-1k | 4.6% in 1-2k

  REAL UNDERWATER SITS ABOVE /sleep/, NOT BELOW IT. /sleep/ measured 399 Hz;
  version 3 was driven to 344 to separate them, and the real thing is at 653 —
  with 74% of its energy in a band where version 3 had almost none.

  The complaint was right: it WAS too close to /sleep/. The remedy was wrong.
  What separates them, per the measurement, was never the depth:

      onsets   3.6 a second — the most of any recording taken. /sleep/ has none.
      sd/mean  0.75 — it moves constantly. /sleep/ barely moves at all.

  THE BUBBLES AND THE MOVEMENT ARE THE DIFFERENCE. Going deeper was solving the
  right problem the wrong way, and three rounds of listening did not reveal that
  where ten minutes of measurement did.

  ── WHAT WAS REMOVED ───────────────────────────────────────────────────────

  THE GHOST OF THE SURFACE is gone. It was added from a written account of deep
  ocean acoustics — a faint hum far above the bed, as a depth cue — and it made
  sense when the bed lived at 40-260 Hz. The bed now occupies 470-960, which is
  where the ghost was; there is no gap left for it to sit in, and keeping it
  would just be a second copy of the same band.

  ── HONEST LIMITS ──────────────────────────────────────────────────────────

  All three sets of recordings — wind, stream, underwater — came off the same
  phone and all peak between 615 and 890 Hz despite being unrelated sources.
  That is very likely the recording chain, so the absolute peak is not to be
  trusted. The COMPARISONS are, because the instrument was constant: underwater
  is the lowest of the three (653 against 810 and 1219), has by far the most
  energy in 250-500 (18.8% against 1.8% and 0.4%), and has the most onsets.

  And it is not known how these were recorded. A phone cannot record underwater
  without a hydrophone; this may be water heard from above rather than from
  within. It is still water, measured, which is more than the previous three
  versions had.
-->

<meta name="theme-color" content="#04080c">
<meta property="og:type" content="website">
<meta property="og:title" content="Underwater">
<meta property="og:description" content="Muffled, insulated, and very dark. Pick how long, and put the phone across the room.">
<meta property="og:url" content="https://sligara7.github.io/jugbeats/underwater/">

<link rel="stylesheet" href="../css/bed.css">
<style>:root { --accent: #6fb6d6; --bg: #04080c; }</style>
</head>
<body>

<main>
  <div id="start">
    <h1>Underwater</h1>
    <p class="sub">Muffled and far from anything.</p>

    <p class="place">Put the phone across the room — <strong>not</strong> in the crib or the cot.
      Then turn the volume up until you can just hear it from where the baby is.</p>

    <div class="label">play for</div>
    <div class="times">
      <button data-min="15">15 min</button>
      <button data-min="30">30 min</button>
      <button data-min="60">1 hour</button>
      <button data-min="120">2 hours</button>
      <button data-min="240">4 hours</button>
      <button data-min="480">8 hours</button>
    </div>
    <p class="err" id="err"></p>
  </div>

  <div id="playing">
    <div class="left">stops in</div>
    <div class="clock" id="clock">—</div>
    <p class="hint">You can lock the phone. It keeps going, and fades out on its own.</p>
    <button id="stop">stop now</button>
  </div>
</main>

<script type="module">
import { runBed, pinkLoop, envelopeLoop, modulate, transientLoop } from '../js/bed.js';

/**
 * ⚠️ EVERY NUMBER HERE IS MEASURED, AND THEY REVERSE A CHANGE THE OWNER ASKED
 * FOR. That is worth reading before touching any of them.
 *
 * He said, of the previous version: "the ocean frequency should be lower - it
 * isn't too far from how the regular sleep sounds." He was right that it was too
 * close to /sleep/, and I went DOWN to separate them — /sleep/ measured 399 Hz,
 * so this went to 344.
 *
 * Then he recorded actual underwater sound. Median of three clips:
 *
 *     centroid 653 Hz   peak 686   Q 1.4   sd/mean 0.75   onsets 3.6/s
 *     energy: 1.9% under 250 Hz, 18.8% in 250-500, 74.6% in 500-1k, 4.6% in 1-2k
 *
 * REAL UNDERWATER IS ABOVE /sleep/, NOT BELOW IT. The version built to his
 * instruction sat an octave and a half beneath the real thing, with 74% of its
 * energy in a band where the recording has almost none.
 *
 * AND THE MEASUREMENT SAYS WHAT ACTUALLY SEPARATES THEM, which was never depth:
 * 3.6 onsets a second — the most of any recording taken — where /sleep/ has
 * none, and sd/mean 0.75 where /sleep/ barely moves. THE BUBBLES AND THE
 * MOVEMENT ARE THE DIFFERENCE. Going deeper was solving the right problem the
 * wrong way, and it took a recording to see it.
 *
 * If this now sounds too close to /sleep/ again, the answer is more bubbles and
 * more movement, not a lower band.
 */

/** Fitted: 67% of the energy lands in 500-1k against a measured 75%. */
const MAIN = [470, 960];

/** The shoulder underneath. 0.30 puts about 19% in 250-500, which is what the
 *  recording has; a single wider band could not hold both proportions. */
const SHOULDER = [240, 520];
const SHOULDER_GAIN = 0.30;

/**
 * Loudness is judged mostly between 500 Hz and 4 kHz, and this bed now lives
 * inside the bottom of that — unlike the previous version, which sat below it
 * and needed a large number to be heard at all. So the ceiling comes back DOWN,
 * from 0.33, even though the bed got louder to the ear.
 */
const CEILING = 0.20;

/**
 * HOW IT MOVES. Measured sd/mean is 0.75 — more than a stream's 0.51 and far
 * less than wind's 1.67. Water surging past has some of a gust's character and
 * none of its violence, so the envelope is raised to the fourth power where
 * /forest/ uses five and /stream/ uses two.
 */
const SWELL_CYCLES = [[11.3, 1.0], [17.9, 0.7], [29.3, 0.5]];
const SWELL_POWER = 4;
const SWELL_FLOOR = 0.30;
const SWELL_DEPTH = 0.95;
const SWELL_SECONDS = 181;
const SWELL_RATE = 8000;

function swellShape(t) {
  const secs = t * SWELL_SECONDS;
  let g = 0;
  let max = 0;
  for (const [period, amount] of SWELL_CYCLES) {
    g += amount * (0.5 - 0.5 * Math.cos((2 * Math.PI * secs) / period));
    max += amount;
  }
  return SWELL_FLOOR + SWELL_DEPTH * Math.pow(g / max, SWELL_POWER);
}

function band(ctx, sources, [lo, hi], seconds, gain, dest, t0) {
  const src = ctx.createBufferSource();
  src.buffer = pinkLoop(ctx, seconds, { brown: 0.5, rate: 8000 });
  src.loop = true;
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.setValueAtTime(lo, t0);
  hp.Q.value = 0.9;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(hi, t0);
  lp.Q.value = 0.9;
  const g = ctx.createGain();
  g.gain.value = gain;
  src.connect(hp).connect(lp).connect(g).connect(dest);
  src.start(t0);
  sources.push(src);
}

runBed({
  title: 'Underwater',
  ceiling: CEILING,
  fadeIn: 12,
  fadeOut: 90,

  build(ctx, dest, t0, sources) {
    // One envelope over the whole thing, because the two bands are one sound
    // measured in halves rather than two parts of a mix.
    const swell = ctx.createGain();
    swell.gain.setValueAtTime(0, t0);
    swell.connect(dest);

    band(ctx, sources, MAIN, 53, 1.0, swell, t0);
    band(ctx, sources, SHOULDER, 71, SHOULDER_GAIN, swell, t0);

    const shape = envelopeLoop(ctx, SWELL_SECONDS, swellShape, SWELL_RATE);
    modulate(ctx, sources, shape, 1.0, t0, swell.gain);

    // ── the bubbles ───────────────────────────────────────────────────────
    // THE MOST ONSETS OF ANY RECORDING TAKEN — 3.6 a second, against wind's 1.4
    // and a stream's 1.8. They are not decoration on this bed, they are what
    // makes it water rather than a filter setting, and the earlier version had
    // them at a third of this.
    //
    // Short decays for the reason /rain/ paid for: a resonator held past about
    // 100ms stops being a strike and becomes a PITCH, and a pitched bubble is a
    // marimba.
    const top = ctx.createBiquadFilter();
    top.type = 'lowpass';
    top.frequency.setValueAtTime(1400, t0);
    top.Q.value = 0.7;
    const gain = ctx.createGain();
    gain.gain.value = 0.55;
    top.connect(gain).connect(dest);

    for (const cfg of [
      { seconds: 127, perSecond: 2.4, hzLow: 190, hzHigh: 700, decay: 0.012, level: 1.5 },
      { seconds: 167, perSecond: 1.3, hzLow: 260, hzHigh: 950, decay: 0.008, level: 1.1 },
    ]) {
      const src = ctx.createBufferSource();
      src.buffer = transientLoop(ctx, cfg);
      src.loop = true;
      src.connect(top);
      src.start(t0);
      sources.push(src);
    }
  },
});
</script>
</body>
</html>
