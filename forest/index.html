<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forest</title>

<!--
  THE FOREST PAGE — and the first thing here that was measured rather than
  reasoned about.

  ── FOUR WRONG VERSIONS, THEN A RECORDING ──────────────────────────────────

  This bed was attempted four times from theory and was wrong every time, each
  time in a way the owner heard immediately and I had not:

    1. pitched raindrops       -> "wind or waves with rain drops"
    2. unpitched grains        -> "still sounds like rain"
    3. fluttered noise, wide   -> "a stampede of buffalos"
    4. banded higher, untilted -> still not leaves

  Then he recorded the actual wind on his phone and asked for it to be analysed.
  Five clips, and they settled in ten minutes what four rounds of reasoning had
  not.

  ── WHAT THE RECORDINGS SAY ────────────────────────────────────────────────

  IT IS A NARROW BAND, AND LOWER THAN I THOUGHT. 80-92% of the energy sits in a
  single octave, peaking at 814, 888, 888, 891 and 894 Hz across the five files,
  with a measured Q between 1.8 and 2.6. Essentially nothing above 2 kHz and
  nothing below 500. The version before this one was spread across 950-3400 with
  a centroid of 2020 — two and a half times too high.

  IT VARIES ENORMOUSLY. The amplitude envelope has sd/mean 1.67. The version
  before had 0.30. Every flat version of this bed sounded like a machine or a
  hiss, and that number is why.

  AND THE GUSTS ARE PEAKY, WHICH IS THE ACTUAL DISCOVERY. Three summed cosines
  give sd/mean 0.68 — not close. Raising the sum to the FIFTH power gives 1.69.
  Wind is long quiet stretches with occasional strong arrivals, not a steady
  heaving, and no amount of adjusting levels on a smooth envelope reaches it.

  FEW SHARP ONSETS: 1.4 a second, against 13 for the grains that sounded like
  rain. That one I had already guessed; the other three I had not.

  ── AND ONE THING THE MEASUREMENT EXPLAINED RETROSPECTIVELY ────────────────

  Earlier versions added a fast "flutter" modulator to stop the sound being
  static. A band this narrow ALREADY has a fast-fluctuating envelope, because
  that is simply what narrowband noise does. The modulator was doing badly, and
  at real cost, what the filter does for nothing — and it was manufacturing the
  onsets that made the thing sound like rain.

  ── HONEST LIMITS OF THE DATA ──────────────────────────────────────────────

  These are phone recordings: 51 kbps AAC, and phones apply wind-noise reduction
  outdoors, which is a highpass. Some of the missing bottom may be the phone
  rather than the wind, and these files cannot separate the two. The peak sits in
  the same place in all five, which is either a real property of the trees or a
  property of the recording chain — also not separable from this data.

  What is not in doubt is the DIRECTION: whatever mix of wind and phone these
  files are, they are nothing like what this page was producing.
-->

<meta name="theme-color" content="#070b07">
<meta property="og:type" content="website">
<meta property="og:title" content="Forest">
<meta property="og:description" content="Wind through a lot of leaves. Pick how long, and put the phone across the room.">
<meta property="og:url" content="https://sligara7.github.io/jugbeats/forest/">

<link rel="stylesheet" href="../css/bed.css">
<style>:root { --accent: #9ed6a0; --bg: #070b07; }</style>
</head>
<body>

<main>
  <div id="start">
    <h1>Forest</h1>
    <p class="sub">Wind moving through a lot of leaves.</p>

    <p class="place">Put the phone across the room — <strong>not</strong> in the crib or the cot.
      Then turn the volume up until you can just hear it from where the baby is.</p>

    <div class="label">play for</div>
    <div class="times">
      <button data-min="15">15 min</button>
      <button data-min="30">30 min</button>
      <button data-min="60">1 hour</button>
      <button data-min="120">2 hours</button>
      <button data-min="240">4 hours</button>
      <button data-min="480">8 hours</button>
    </div>
    <p class="err" id="err"></p>
  </div>

  <div id="playing">
    <div class="left">stops in</div>
    <div class="clock" id="clock">—</div>
    <p class="hint">You can lock the phone. It keeps going, and fades out on its own.</p>
    <button id="stop">stop now</button>
  </div>
</main>

<script type="module">
import { runBed, pinkLoop, envelopeLoop, modulate, noiseLayer } from '../js/bed.js';

/**
 * ⚠️ EVERY NUMBER BELOW IS MEASURED FROM REAL WIND, not reasoned about.
 *
 * Five phone recordings of wind in trees were analysed after four attempts at
 * this bed had all been wrong. What they say is in the header; what matters here
 * is that the old version missed on all three measurements at once:
 *
 *                       centroid    sd/mean   onsets/s
 *   real wind               810       1.67        1.4
 *   the version before     2020       0.30        0.0
 *   this one                837       1.69        1.1
 */

/** Where the wind actually sits. Measured across five recordings: 814, 888,
 *  888, 891 and 894 Hz. Not 1500, which is where I had put it. */
const CENTRE = 850;

/** And how NARROW it is — measured Q between 1.8 and 2.6, so roughly 640 to
 *  1060 Hz and almost nothing outside that. The old version spread itself
 *  across 950-3400 and was wrong at both ends. */
const Q = 2.0;

/**
 * THE GUSTS, AND THE EXPONENT IS THE WHOLE DISCOVERY.
 *
 * Real wind's envelope has sd/mean 1.67 — it varies enormously. Three summed
 * cosines give 0.68, nowhere near, and every flatter version of this bed sounded
 * like something other than wind. Raising the sum to the FIFTH POWER gives 1.69.
 *
 * What the exponent does is make the gusts PEAKY: long quiet stretches with the
 * occasional strong arrival, instead of a steady heaving. That shape is what
 * wind is, and no amount of adjusting levels on a smooth envelope gets there.
 */
const GUST_POWER = 5;
const GUST_FLOOR = 0.02;
const GUST_CYCLES = [[7.3, 1.0], [11.9, 0.7], [19.3, 0.5]];

/** One long envelope rather than three modulators, because the exponent applies
 *  to the SUM and AudioParams can only add. Prime, and over three minutes. */
const GUST_SECONDS = 197;

/** The envelope carries a fraction of a hertz, so it is built at 400 Hz. */
const GUST_RATE = 8000;

const CEILING = 0.30;

function gustShape(t) {
  const secs = t * GUST_SECONDS;
  let g = 0;
  let max = 0;
  for (const [period, amount] of GUST_CYCLES) {
    g += amount * (0.5 - 0.5 * Math.cos((2 * Math.PI * secs) / period));
    max += amount;
  }
  return GUST_FLOOR + Math.pow(g / max, GUST_POWER);
}

runBed({
  title: 'Forest',
  ceiling: CEILING,
  fadeIn: 10,
  fadeOut: 90,

  build(ctx, dest, t0, sources) {
    // ── the wind in the leaves ────────────────────────────────────────────
    // ONE NARROW BAND, AND THAT IS NEARLY ALL OF IT. The recordings put 80-92%
    // of their energy in a single octave around 850 Hz, with essentially nothing
    // above 2 kHz and nothing below 500.
    //
    // AND THE FAST FLUTTER COMES FREE. Earlier versions added a flutter
    // modulator to make the sound alive; a band this narrow already has an
    // envelope that fluctuates quickly, because that is what narrowband noise
    // does. The modulator was doing badly what the filter does for nothing.
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, t0);

    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(CENTRE - CENTRE / Q / 2, t0);
    hp.Q.value = 0.9;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(CENTRE + CENTRE / Q / 2, t0);
    lp.Q.value = 0.9;

    // Two lengths, coprime primes, so the noise itself never lines up twice.
    for (const [seconds, level] of [[53, 1.0], [71, 0.7]]) {
      const src = ctx.createBufferSource();
      src.buffer = pinkLoop(ctx, seconds, { rate: 12000 });
      src.loop = true;
      const g = ctx.createGain();
      g.gain.value = level;
      src.connect(g).connect(hp);
      src.start(t0);
      sources.push(src);
    }
    hp.connect(lp).connect(gain).connect(dest);

    // ── a little body underneath ──────────────────────────────────────────
    // ⚠️ SMALLER THAN INSTINCT SAYS, AND THE RECORDINGS ARE WHY. They hold
    // 0.1% of their energy below 250 Hz — there is no low end in wind through
    // trees at all. What little is here is for the phone speaker rather than for
    // the sound: a bed with literally nothing under 500 Hz has nothing for a
    // small speaker to hold on to.
    //
    // Honest caveat: a phone applies wind-noise reduction when recording
    // outdoors, which is a highpass. Some of that missing bottom may be the
    // phone rather than the wind, and these files cannot tell the two apart.
    noiseLayer(ctx, sources, { seconds: 11.7, cut: 320, gain: 0.10 }, dest, t0);

    // ── the gusts ─────────────────────────────────────────────────────────
    const shape = envelopeLoop(ctx, GUST_SECONDS, gustShape, GUST_RATE);
    modulate(ctx, sources, shape, 1.0, t0, gain.gain);
    // The band opens slightly as a gust arrives — harder wind reaches higher —
    // but only slightly, because the measurement says the centre barely moves.
    modulate(ctx, sources, shape, 260, t0, lp.frequency);
  },
});
</script>
</body>
</html>
