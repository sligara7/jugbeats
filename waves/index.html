<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waves</title>

<!--
  THE WAVES PAGE — the sleep bed, with the sea in it.

  WHY IT EXISTS. The owner's mother heard /sleep/ and said it reminded her of
  waves at the ocean; he had thought the same. Two listeners, one of them outside
  the project entirely, hearing the sea in a bed designed to imitate a car cabin.
  That is a finding about what the spectrum actually sounds like rather than a
  coincidence — low-weighted pink noise with slow movement on level and
  brightness is most of what distant surf is. This keeps those frequencies and
  gives them the RHYTHM.

  MOVED ONTO ../js/bed.js ON 2026-09-21, when rain arrived. This page was first
  written by copying /sleep/, which was defensible once and recorded as a known
  cost; rain would have been the second copy. What is left here is only what
  makes it the SEA — the engine no longer lives in this file.

  ── HOW A WAVE IS MADE, AND WHY IT IS NOT A TIMER ──────────────────────────

  No JavaScript runs after the tap, because a backgrounded tab on a locked phone
  has its timers stopped. Eight hours of individually scheduled waves is
  thousands of automation points, and a timer drawing them as it went would die
  with the screen.

  So the waves come out of the audio graph itself: a looping buffer holding the
  SHAPE of one wave, connected to an AudioParam, is a modulator that needs
  nothing to keep it going. Three at coprime lengths drift in and out of phase
  and never repeat — sometimes three coincide and a big one arrives, sometimes
  none do and the sea goes quiet. Surf comes in sets, and this is that for free.

  Measured over thirty minutes: a wave every 11.1 seconds, cutoff swinging 380 Hz
  to 1614 Hz, the loudest one per cent standing about three times above the
  median, and no repeat within five minutes.
-->

<meta name="theme-color" content="#050a0e">
<meta property="og:type" content="website">
<meta property="og:title" content="Waves">
<meta property="og:description" content="Slow surf to fall asleep to. Pick how long, and put the phone across the room.">
<meta property="og:url" content="https://sligara7.github.io/jugbeats/waves/">

<link rel="stylesheet" href="../css/bed.css">
<style>:root { --accent: #7fd6ff; --bg: #050a0e; }</style>
</head>
<body>

<main>
  <div id="start">
    <h1>Waves</h1>
    <p class="sub">Slow surf, a long way off.</p>

    <p class="place">Put the phone across the room — <strong>not</strong> in the crib or the cot.
      Then turn the volume up until you can just hear it from where the baby is.</p>

    <div class="label">play for</div>
    <div class="times">
      <button data-min="15">15 min</button>
      <button data-min="30">30 min</button>
      <button data-min="60">1 hour</button>
      <button data-min="120">2 hours</button>
      <button data-min="240">4 hours</button>
      <button data-min="480">8 hours</button>
    </div>
    <p class="err" id="err"></p>
  </div>

  <div id="playing">
    <div class="left">stops in</div>
    <div class="clock" id="clock">—</div>
    <p class="hint">You can lock the phone. It keeps going, and fades out on its own.</p>
    <button id="stop">stop now</button>
  </div>
</main>

<script type="module">
import { runBed, pinkLoop, envelopeLoop, modulate, noiseLayer } from '../js/bed.js';

/** A shade under /sleep/'s, because breaking waves carry more high end than a
 *  car cabin and more high end reads louder. */
const CEILING = 0.20;

/** The surf's lowpass at rest, and how far the waves open it. A wave has to
 *  BREAK — brighten as it arrives — or it is only a swell. */
const CUT_FLOOR = 380;
const CUT_SWING = 1150;

/**
 * THREE WAVE CYCLES AT COPRIME LENGTHS, in the range an ocean swell actually
 * sits in — roughly eight to twenty seconds between breaking waves.
 */
const WAVES = [
  { seconds: 11.3, amount: 0.46 },
  { seconds: 17.9, amount: 0.32 },
  { seconds: 23.7, amount: 0.26 },
];

/**
 * ONE WAVE, AS A SHAPE — the part that decides whether this is the sea or a
 * machine breathing.
 *
 * A sine rises and falls evenly and sounds wrong immediately. A wave spends
 * longer running out than it did building: it gathers slowly and accelerating,
 * breaks briefly, hisses away over longer than the build took, and leaves a
 * trough before the next one. Measured: 39% building, 61% running out.
 *
 * It never reaches zero, because it is summed with two others and a hard zero
 * would put a corner in the result. The trough is low, not silent — and the
 * undertow underneath never stops, so the sea is never silent either.
 */
function waveShape(t) {
  const BUILD = 0.34;   // gathering
  const CREST = 0.10;   // breaking
  const RUN = 0.40;     // hissing out
  if (t < BUILD) return Math.pow(t / BUILD, 2.3);
  if (t < BUILD + CREST) {
    const u = (t - BUILD) / CREST;
    return 1 + 0.06 * Math.sin(u * Math.PI);   // a slight overshoot at the break
  }
  if (t < BUILD + CREST + RUN) {
    return Math.exp(-3.1 * ((t - BUILD - CREST) / RUN));
  }
  const u = (t - BUILD - CREST - RUN) / (1 - BUILD - CREST - RUN);
  return Math.exp(-3.1) * (1 - u) * 0.6;       // settle into the trough
}

runBed({
  title: 'Waves',
  ceiling: CEILING,
  fadeIn: 10,
  fadeOut: 90,

  build(ctx, dest, t0, sources) {
    // ── the undertow ──────────────────────────────────────────────────────
    // Constant, low, never stops. The sea between waves.
    noiseLayer(ctx, sources, { seconds: 11.7, cut: 260, gain: 0.85 }, dest, t0);

    // ── the surf ──────────────────────────────────────────────────────────
    // The layer the waves actually happen to. Both its gain and its cutoff start
    // at the BOTTOM of their travel and are opened by the wave envelopes, so a
    // quiet moment really is quiet and a big one really is three waves at once.
    const surfGain = ctx.createGain();
    const surfLp = ctx.createBiquadFilter();
    surfLp.type = 'lowpass';
    surfLp.Q.value = 0.8;
    surfGain.gain.setValueAtTime(0, t0);
    surfLp.frequency.setValueAtTime(CUT_FLOOR, t0);

    const surf = ctx.createBufferSource();
    surf.buffer = pinkLoop(ctx, 13.9);
    surf.loop = true;
    surf.connect(surfLp).connect(surfGain).connect(dest);
    surf.start(t0);
    sources.push(surf);

    // ── the waves ─────────────────────────────────────────────────────────
    // Each cycle drives the gain and, scaled up, the filter — so a wave brightens
    // as it breaks instead of merely getting louder.
    for (const w of WAVES) {
      const shape = envelopeLoop(ctx, w.seconds, waveShape);
      modulate(ctx, sources, shape, w.amount, t0, surfGain.gain);
      modulate(ctx, sources, shape, w.amount * CUT_SWING, t0, surfLp.frequency);
    }
  },
});
</script>
</body>
</html>
